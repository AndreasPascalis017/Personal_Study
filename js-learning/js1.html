<!DOCTYPE html>
<html lang="en">

<head>
    <!--in order to use javascript we need a script element-->
    <!--usually we put those in head or body section-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!--put script at the end of the body element after all the existing element-->
    <!--the reason being that the browser parsing the code fromt top to bottom to avoid business during execution-->
    <h1>Hello World</h1>
    <!--when we want reference our script use src = "script name"-->
    <script src="js1.js"></script>
</body>

</html>
